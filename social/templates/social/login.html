{% extends 'social/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="auth-panel">
  <h1>Login</h1>
  <form method="post" class="form-stack">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
  </form>
  <p>No account yet? <a href="{% url 'register' %}">Register</a></p>
</section>
{% endblock %}
