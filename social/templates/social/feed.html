{% extends 'social/base.html' %}
{% block title %}Newsfeed{% endblock %}
{% block content %}
<div class="layout">
  <section>
    <div class="section-head">
      <h1>Newsfeed</h1>
      <a class="button" href="{% url 'post_create' %}">New post</a>
    </div>
    {% for post in posts %}
      {% include 'social/post_card.html' with post=post %}
    {% empty %}
      <p class="empty">No posts yet.</p>
    {% endfor %}
  </section>
</div>
{% endblock %}
